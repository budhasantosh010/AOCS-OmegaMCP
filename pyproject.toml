[project]
name = "aocs-mcp-server"
version = "1.0.0"
description = "AOCS‑Ω FastMCP Server — Apex Omniscient Cognitive System"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "anthropic>=0.30.0",
    "openai>=1.0.0",
]

[project.scripts]
aocs = "aocs_mcp.cli:main"
aocs-mcp = "aocs_mcp:main"

[tool.setuptools.packages.find]
include = ["aocs_mcp*"]
